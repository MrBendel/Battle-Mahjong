<svg xmlns="http://www.w3.org/2000/svg" width="512" height="736" viewBox="0 0 512 736">
  <defs>
    <!-- Soft contact shadow -->
    <linearGradient id="shadow_grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1a14" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#05100c" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Warm Bamboo / Wood lower base -->
    <linearGradient id="bamboo_body" x1="0.1" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#d4a366"/>
      <stop offset="0.35" stop-color="#b68249"/>
      <stop offset="0.75" stop-color="#8f5d2d"/>
      <stop offset="1" stop-color="#6a411b"/>
    </linearGradient>

    <!-- Bamboo bottom bevel highlight -->
    <linearGradient id="bamboo_lip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8844b"/>
      <stop offset="0.5" stop-color="#dfb279"/>
      <stop offset="1" stop-color="#a06e39"/>
    </linearGradient>

    <!-- Porcelain outer rim / bevel -->
    <linearGradient id="porcelain_rim" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#faf3e3"/>
      <stop offset="0.75" stop-color="#ebdcc0"/>
      <stop offset="1" stop-color="#c9b18c"/>
    </linearGradient>

    <!-- Porcelain main face surface -->
    <linearGradient id="porcelain_face" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#fffefb"/>
      <stop offset="0.35" stop-color="#fdf7e9"/>
      <stop offset="0.7" stop-color="#f7edd8"/>
      <stop offset="1" stop-color="#ede0c4"/>
    </linearGradient>
  </defs>

  <!-- 1. Ambient Drop Shadow -->
  <rect x="18" y="24" width="476" height="696" rx="56" fill="url(#shadow_grad)" opacity="0.75"/>

  <!-- 2. Lower Bamboo/Wood Body -->
  <rect x="14" y="16" width="484" height="696" rx="54" fill="url(#bamboo_body)" stroke="#452a14" stroke-width="4.5"/>

  <!-- 3. Bamboo Side & Bottom Lip Highlights -->
  <path d="M22 620 Q20 702 70 708 H442 Q492 702 490 620 V660 Q490 710 436 712 H76 Q22 710 22 660 Z" fill="url(#bamboo_lip)" opacity="0.65"/>
  <path d="M72 708 H440" stroke="#f0caa1" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- 4. Upper Porcelain Layer (Bevel Rim) -->
  <rect x="16" y="14" width="480" height="644" rx="52" fill="url(#porcelain_rim)" stroke="#b89e78" stroke-width="2"/>

  <!-- 5. Main Porcelain Face Plate -->
  <rect x="24" y="22" width="464" height="628" rx="44" fill="url(#porcelain_face)" stroke="#ffffff" stroke-width="3"/>

  <!-- 6. Hairline Inner Accent -->
  <rect x="28" y="26" width="456" height="620" rx="40" fill="none" stroke="#684f35" stroke-width="1.2" opacity="0.16"/>

  <!-- 7. Specular Glaze Highlights -->
  <!-- Top specular gleam -->
  <path d="M64 32 Q256 18 448 32" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.82"/>
  <path d="M80 34 Q256 22 432 34" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.95"/>

  <!-- Left specular rim -->
  <path d="M30 68 Q22 320 30 580" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.55"/>

  <!-- Soft Bottom Bevel Transition Shadow on the porcelain -->
  <path d="M48 644 Q256 652 464 644" fill="none" stroke="#b09673" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
</svg>

