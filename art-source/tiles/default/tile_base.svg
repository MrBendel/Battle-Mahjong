<svg xmlns="http://www.w3.org/2000/svg" width="512" height="736" viewBox="0 0 512 736">
  <defs>
    <!-- 2.5D Extrusion Facet (Warm porcelain biscuit matching inspiration artwork) -->
    <linearGradient id="extrusion_fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#967349"/>
      <stop offset="12%" stop-color="#b2916b"/>
      <stop offset="35%" stop-color="#cbaf8b"/>
      <stop offset="65%" stop-color="#ddc5a8"/>
      <stop offset="85%" stop-color="#ebd5be"/>
      <stop offset="100%" stop-color="#f8ebdc"/>
    </linearGradient>

    <!-- Bottom Rim Glowing Highlight (Catches light along bottom curve and corners) -->
    <linearGradient id="bottom_rim_glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b89369" stop-opacity="0.2"/>
      <stop offset="8%" stop-color="#e2cbac" stop-opacity="0.75"/>
      <stop offset="25%" stop-color="#fff8ed" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1.0"/>
      <stop offset="75%" stop-color="#fff8ed" stop-opacity="0.95"/>
      <stop offset="92%" stop-color="#e2cbac" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#b89369" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Volumetric Convex Porcelain Face Surface -->
    <radialGradient id="porcelain_face_shading" cx="44%" cy="36%" r="68%">
      <stop offset="0%" stop-color="#fffefa"/>
      <stop offset="30%" stop-color="#fdf6e7"/>
      <stop offset="65%" stop-color="#f8ecd5"/>
      <stop offset="88%" stop-color="#eed8ba"/>
      <stop offset="100%" stop-color="#e2c59e"/>
    </radialGradient>

    <!-- Outer Porcelain Bevel Rim Gradient -->
    <linearGradient id="porcelain_outer_rim" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fdf7ec"/>
      <stop offset="55%" stop-color="#f3e0c4"/>
      <stop offset="85%" stop-color="#e4c7a2"/>
      <stop offset="100%" stop-color="#caa77d"/>
    </linearGradient>

    <!-- Soft Perimeter Ambient Occlusion Gradients -->
    <linearGradient id="face_ao_vertical" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="6%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="88%" stop-color="#9a7140" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7c5324" stop-opacity="0.32"/>
    </linearGradient>

    <linearGradient id="face_ao_horizontal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="5%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="94%" stop-color="#92693a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7c5122" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- ===================================================================== -->
  <!-- 1. AMBIENT CONTACT SHADOW                                             -->
  <!-- ===================================================================== -->
  <rect x="14" y="28" width="484" height="696" rx="56" fill="#04120a" opacity="0.45"/>
  <rect x="18" y="34" width="476" height="690" rx="54" fill="#020a06" opacity="0.28"/>
  <ellipse cx="256" cy="722" rx="224" ry="10" fill="#030e07" opacity="0.45"/>

  <!-- ===================================================================== -->
  <!-- 2. DEEP SOLID CERAMIC TILE EXTRUSION (Unified 2.5D Facet)             -->
  <!-- ===================================================================== -->
  <!-- Seamless Lower 2.5D Extrusion Facet (Spans y=570 to y=716, 104px depth) -->
  <path d="M 18 566 C 18 596 40 612 70 612 H 442 C 472 612 494 596 494 566 V 662 C 494 692 472 716 442 716 H 70 C 40 716 18 692 18 662 Z" fill="url(#extrusion_fill)" stroke="#684a28" stroke-width="2.2"/>

  <!-- Prominent Glowing Bottom Edge Rim Highlight (Wraps corners continuously) -->
  <!-- Ambient glow halo -->
  <path d="M 24 662 C 24 694 44 716 72 716 H 440 C 468 716 488 694 488 662" fill="none" stroke="url(#bottom_rim_glow)" stroke-width="7.5" stroke-linecap="round" opacity="0.65"/>
  <!-- Sharp specular glint -->
  <path d="M 26 662 C 26 694 44 716 72 716 H 440 C 468 716 488 694 488 662" fill="none" stroke="#ffffff" stroke-width="3.0" stroke-linecap="round" opacity="0.95"/>
  <!-- Central intense glint -->
  <path d="M 90 715 H 422" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.5"/>

  <!-- ===================================================================== -->
  <!-- 3. VOLUMETRIC PORCELAIN FACE PLATE                                    -->
  <!-- ===================================================================== -->
  <!-- Outer Porcelain Face Plate (Contoured with rounded bevel, y=18 to y=612) -->
  <path d="M 70 18 H 442 C 472 18 494 40 494 70 V 566 C 494 596 472 612 442 612 H 70 C 40 612 18 596 18 566 V 70 C 18 40 40 18 70 18 Z" fill="url(#porcelain_outer_rim)" stroke="#a8875e" stroke-width="1.6"/>

  <!-- Inner Porcelain Face Surface (Warm convex dome) -->
  <path d="M 70 24 H 442 C 468 24 488 44 488 70 V 564 C 488 590 468 606 442 606 H 70 C 44 606 24 590 24 564 V 70 C 24 44 44 24 70 24 Z" fill="url(#porcelain_face_shading)"/>

  <!-- Ambient Occlusion Gradients over Face Surface -->
  <path d="M 70 24 H 442 C 468 24 488 44 488 70 V 564 C 488 590 468 606 442 606 H 70 C 44 606 24 590 24 564 V 70 C 24 44 44 24 70 24 Z" fill="url(#face_ao_vertical)"/>
  <path d="M 70 24 H 442 C 468 24 488 44 488 70 V 564 C 488 600 468 606 442 606 H 70 C 44 606 24 600 24 564 V 70 C 24 44 44 24 70 24 Z" fill="url(#face_ao_horizontal)"/>

  <!-- Four Classic Corner Notches (from the inspiration artwork) -->
  <path d="M38 52 C38 42 46 36 56 36" fill="none" stroke="#caa576" stroke-width="4.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M474 52 C474 42 466 36 456 36" fill="none" stroke="#caa576" stroke-width="4.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M38 574 C38 584 46 590 56 590" fill="none" stroke="#b08a5c" stroke-width="4.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M474 574 C474 584 466 590 456 590" fill="none" stroke="#b08a5c" stroke-width="4.5" stroke-linecap="round" opacity="0.55"/>

  <!-- Delicate Inner Bevel Accent Hairline -->
  <path d="M 70 27 H 442 C 466 27 485 46 485 70 V 562 C 485 586 466 603 442 603 H 70 C 46 603 27 586 27 562 V 70 C 27 46 46 27 70 27 Z" fill="none" stroke="#7a5d38" stroke-width="1.0" opacity="0.16"/>

  <!-- Bottom Lip Soft Bevel on Face Plate Edge (Gentle ivory roll-off) -->
  <path d="M 36 578 C 36 602 50 611 76 611 H 436 C 462 611 476 602 476 578" fill="none" stroke="#fff8ee" stroke-width="2.6" stroke-linecap="round" opacity="0.6"/>

  <!-- ===================================================================== -->
  <!-- 4. SPECULAR GLAZE HIGHLIGHTS                                          -->
  <!-- ===================================================================== -->
  <!-- Top Specular Gleam Arc -->
  <path d="M64 28 Q256 14 448 28" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M82 30 Q256 18 430 30" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>

  <!-- Left Specular Edge Sheen -->
  <path d="M26 62 Q18 290 26 540" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.5"/>
</svg>



