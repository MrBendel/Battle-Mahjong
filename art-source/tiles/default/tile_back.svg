<svg xmlns="http://www.w3.org/2000/svg" width="512" height="736" viewBox="0 0 512 736">
  <defs>
    <!-- 2.5D Extrusion Facet (Identical to tile_base) -->
    <linearGradient id="back_extrusion_fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#967349"/>
      <stop offset="12%" stop-color="#b2916b"/>
      <stop offset="35%" stop-color="#cbaf8b"/>
      <stop offset="65%" stop-color="#ddc5a8"/>
      <stop offset="85%" stop-color="#ebd5be"/>
      <stop offset="100%" stop-color="#f8ebdc"/>
    </linearGradient>

    <!-- Bottom Rim Glowing Highlight (Identical to tile_base) -->
    <linearGradient id="back_bottom_rim_glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b89369" stop-opacity="0.2"/>
      <stop offset="8%" stop-color="#e2cbac" stop-opacity="0.75"/>
      <stop offset="25%" stop-color="#fff8ed" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1.0"/>
      <stop offset="75%" stop-color="#fff8ed" stop-opacity="0.95"/>
      <stop offset="92%" stop-color="#e2cbac" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#b89369" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Outer Porcelain Bevel Rim (Identical to tile_base) -->
    <linearGradient id="back_porcelain_rim" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fdf7ec"/>
      <stop offset="55%" stop-color="#f3e0c4"/>
      <stop offset="85%" stop-color="#e4c7a2"/>
      <stop offset="100%" stop-color="#caa77d"/>
    </linearGradient>

    <!-- Classic Ivory Original Artwork: Sage/Matcha Green Inset Field -->
    <radialGradient id="sage_green_field" cx="46%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#809c77"/>
      <stop offset="45%" stop-color="#67835e"/>
      <stop offset="85%" stop-color="#526d49"/>
      <stop offset="100%" stop-color="#425c39"/>
    </radialGradient>

    <!-- Subtle Textured Matting / Felt Pattern -->
    <pattern id="felt_weave" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.5" fill="#364d30" opacity="0.25"/>
      <circle cx="0" cy="0" r="1.2" fill="#9db994" opacity="0.2"/>
      <circle cx="16" cy="16" r="1.2" fill="#9db994" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- ===================================================================== -->
  <!-- 1. AMBIENT CONTACT SHADOW (Identical to front)                        -->
  <!-- ===================================================================== -->
  <rect x="14" y="28" width="484" height="696" rx="56" fill="#04120a" opacity="0.45"/>
  <rect x="18" y="34" width="476" height="690" rx="54" fill="#020a06" opacity="0.28"/>
  <ellipse cx="256" cy="722" rx="224" ry="10" fill="#030e07" opacity="0.45"/>

  <!-- ===================================================================== -->
  <!-- 2. DEEP SOLID CERAMIC TILE EXTRUSION (Identical to front)             -->
  <!-- ===================================================================== -->
  <path d="M 18 566 C 18 596 40 612 70 612 H 442 C 472 612 494 596 494 566 V 662 C 494 692 472 716 442 716 H 70 C 40 716 18 692 18 662 Z" fill="url(#back_extrusion_fill)" stroke="#684a28" stroke-width="2.2"/>

  <!-- Prominent Glowing Bottom Edge Rim Highlight (Matches front 1:1)       -->
  <path d="M 24 662 C 24 694 44 716 72 716 H 440 C 468 716 488 694 488 662" fill="none" stroke="url(#back_bottom_rim_glow)" stroke-width="7.5" stroke-linecap="round" opacity="0.65"/>
  <path d="M 26 662 C 26 694 44 716 72 716 H 440 C 468 716 488 694 488 662" fill="none" stroke="#ffffff" stroke-width="3.0" stroke-linecap="round" opacity="0.95"/>
  <path d="M 90 715 H 422" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Outer Porcelain Bevel Rim (Identical to front) -->
  <path d="M 70 18 H 442 C 472 18 494 40 494 70 V 566 C 494 596 472 612 442 612 H 70 C 40 612 18 596 18 566 V 70 C 18 40 40 18 70 18 Z" fill="url(#back_porcelain_rim)" stroke="#a8875e" stroke-width="1.6"/>

  <!-- Bottom Lip Soft Bevel on Face Plate Edge (Matches front 1:1) -->
  <path d="M 36 578 C 36 602 50 611 76 611 H 436 C 462 611 476 602 476 578" fill="none" stroke="#fff8ee" stroke-width="2.6" stroke-linecap="round" opacity="0.6"/>

  <!-- ===================================================================== -->
  <!-- 3. INSET SAGE / TEA-GREEN FIELD (From Original Artwork Card)          -->
  <!-- ===================================================================== -->
  <!-- Inner Recessed Green Back Plate -->
  <path d="M 70 30 H 442 C 464 30 482 48 482 70 V 558 C 482 580 464 598 442 598 H 70 C 48 598 30 580 30 558 V 70 C 30 48 48 30 70 30 Z" fill="url(#sage_green_field)" stroke="#3e5735" stroke-width="2"/>
  <path d="M 70 30 H 442 C 464 30 482 48 482 70 V 558 C 482 580 464 598 442 598 H 70 C 48 598 30 580 30 558 V 70 C 30 48 48 30 70 30 Z" fill="url(#felt_weave)"/>

  <!-- Inner Ambient Edge Shadow on the green field -->
  <path d="M 70 32 H 442 C 462 32 478 48 478 70 V 556 C 478 578 462 594 442 594 H 70 C 50 594 34 578 34 556 V 70 C 34 48 50 32 70 32 Z" fill="none" stroke="#253820" stroke-width="2.5" opacity="0.5"/>

  <!-- Gold Pinstripe Decorative Inlay Frame -->
  <path d="M 70 42 H 442 C 456 42 468 54 468 70 V 546 C 468 562 456 574 442 574 H 70 C 56 574 44 562 44 546 V 70 C 44 54 56 42 70 42 Z" fill="none" stroke="#dfc382" stroke-width="2.0" opacity="0.85"/>
  <path d="M 70 45 H 442 C 454 45 464 55 464 70 V 543 C 464 558 454 568 442 568 H 70 C 58 568 48 558 48 543 V 70 C 48 55 58 45 70 45 Z" fill="none" stroke="#fef0cc" stroke-width="0.8" opacity="0.5"/>

  <!-- Four Classic Golden Corner Pins / Rivets (from original artwork) -->
  <circle cx="62" cy="62" r="4.5" fill="#f4dc9a" stroke="#8c6a2e" stroke-width="1.2"/>
  <circle cx="450" cy="62" r="4.5" fill="#f4dc9a" stroke="#8c6a2e" stroke-width="1.2"/>
  <circle cx="62" cy="554" r="4.5" fill="#f4dc9a" stroke="#8c6a2e" stroke-width="1.2"/>
  <circle cx="450" cy="554" r="4.5" fill="#f4dc9a" stroke="#8c6a2e" stroke-width="1.2"/>

  <!-- ===================================================================== -->
  <!-- 4. SPECULAR GLAZE HIGHLIGHTS (Exact mirror to front)                  -->
  <!-- ===================================================================== -->
  <path d="M64 28 Q256 14 448 28" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M82 30 Q256 18 430 30" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M26 62 Q18 290 26 540" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.45"/>
</svg>



