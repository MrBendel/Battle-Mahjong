<svg xmlns="http://www.w3.org/2000/svg" width="512" height="736" viewBox="0 0 512 736">
  <defs>
    <!-- Soft Contact Drop Shadow (Identical to tile_base) -->
    <radialGradient id="back_shadow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#04120a" stop-opacity="0.45"/>
      <stop offset="85%" stop-color="#071a10" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#091e14" stop-opacity="0"/>
    </radialGradient>

    <!-- 2.5D Bottom Edge Ceramic Extrusion (Identical to tile_base) -->
    <linearGradient id="back_ceramic_extrusion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfb48e"/>
      <stop offset="25%" stop-color="#b89a72"/>
      <stop offset="65%" stop-color="#9d7f57"/>
      <stop offset="100%" stop-color="#7e623d"/>
    </linearGradient>

    <!-- Bottom Lip Rounded Bevel Highlight (Identical to tile_base) -->
    <linearGradient id="back_ceramic_lip_highlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b0926b"/>
      <stop offset="25%" stop-color="#e2cbb0"/>
      <stop offset="50%" stop-color="#fff5e6"/>
      <stop offset="75%" stop-color="#e2cbb0"/>
      <stop offset="100%" stop-color="#a88a64"/>
    </linearGradient>

    <!-- Outer Porcelain Bevel Rim (Identical to tile_base) -->
    <linearGradient id="back_porcelain_rim" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fdf7ec"/>
      <stop offset="55%" stop-color="#f3e0c4"/>
      <stop offset="85%" stop-color="#e4c7a2"/>
      <stop offset="100%" stop-color="#caa77d"/>
    </linearGradient>

    <!-- Classic Ivory Original Artwork: Sage/Matcha Green Inset Field -->
    <radialGradient id="sage_green_field" cx="46%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#809c77"/>
      <stop offset="45%" stop-color="#67835e"/>
      <stop offset="85%" stop-color="#526d49"/>
      <stop offset="100%" stop-color="#425c39"/>
    </radialGradient>

    <!-- Subtle Textured Matting / Felt Pattern -->
    <pattern id="felt_weave" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.5" fill="#364d30" opacity="0.25"/>
      <circle cx="0" cy="0" r="1.2" fill="#9db994" opacity="0.2"/>
      <circle cx="16" cy="16" r="1.2" fill="#9db994" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- ===================================================================== -->
  <!-- 1. AMBIENT CONTACT SHADOW (Identical to front)                        -->
  <!-- ===================================================================== -->
  <rect x="16" y="24" width="480" height="696" rx="58" fill="#04120a" opacity="0.4"/>
  <rect x="20" y="30" width="472" height="690" rx="56" fill="#020a06" opacity="0.25"/>

  <!-- ===================================================================== -->
  <!-- 2. SOLID CERAMIC TILE BLOCK (Identical to front for 1:1 flip match)   -->
  <!-- ===================================================================== -->
  <rect x="14" y="14" width="484" height="698" rx="54" fill="url(#back_ceramic_extrusion)" stroke="#684f2f" stroke-width="2.5"/>

  <!-- Bottom Block Extrusion Bevel Lip & Highlight -->
  <path d="M22 640 Q20 706 72 710 H440 Q492 706 490 640 V670 Q490 710 436 712 H76 Q22 710 22 670 Z" fill="url(#back_ceramic_lip_highlight)" opacity="0.75"/>
  <path d="M72 710 H440" stroke="#fff8ee" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>

  <!-- Outer Porcelain Bevel Rim (Identical to front) -->
  <rect x="16" y="16" width="480" height="636" rx="50" fill="url(#back_porcelain_rim)" stroke="#a8875e" stroke-width="1.5"/>

  <!-- ===================================================================== -->
  <!-- 3. INSET SAGE / TEA-GREEN FIELD (From Original Artwork Card)          -->
  <!-- ===================================================================== -->
  <!-- Inner Recessed Green Back Plate -->
  <rect x="30" y="30" width="452" height="608" rx="38" fill="url(#sage_green_field)" stroke="#3e5735" stroke-width="2"/>
  <rect x="30" y="30" width="452" height="608" rx="38" fill="url(#felt_weave)"/>

  <!-- Inner Ambient Edge Shadow on the green field -->
  <rect x="32" y="32" width="448" height="604" rx="36" fill="none" stroke="#253820" stroke-width="2.5" opacity="0.5"/>

  <!-- Gold Pinstripe Decorative Inlay Frame -->
  <rect x="42" y="42" width="428" height="584" rx="30" fill="none" stroke="#dfc382" stroke-width="2.0" opacity="0.85"/>
  <rect x="45" y="45" width="422" height="578" rx="28" fill="none" stroke="#fef0cc" stroke-width="0.8" opacity="0.5"/>

  <!-- Four Classic Golden Corner Pins / Rivets (from original artwork) -->
  <circle cx="58" cy="58" r="4.5" fill="#f4dc9a" stroke="#8c6a2e" stroke-width="1.2"/>
  <circle cx="454" cy="58" r="4.5" fill="#f4dc9a" stroke="#8c6a2e" stroke-width="1.2"/>
  <circle cx="58" cy="610" r="4.5" fill="#f4dc9a" stroke="#8c6a2e" stroke-width="1.2"/>
  <circle cx="454" cy="610" r="4.5" fill="#f4dc9a" stroke="#8c6a2e" stroke-width="1.2"/>

  <!-- ===================================================================== -->
  <!-- 4. SPECULAR GLAZE HIGHLIGHTS (Exact mirror to front)                  -->
  <!-- ===================================================================== -->
  <path d="M64 28 Q256 14 448 28" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M82 30 Q256 18 430 30" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M26 62 Q18 310 26 590" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.45"/>
  <path d="M42 648 Q256 656 470 648" fill="none" stroke="#94744b" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
</svg>
