      <!-- Gloss Accent Rim -->
      <circle cx="115.0" cy="155.0" r="45.5" fill="none" stroke="#2564a2" stroke-width="2.8" opacity="0.6"/>
      <!-- Coral-Pink Concentric Band -->
      <circle cx="115.0" cy="155.0" r="35.0" fill="none" stroke="#ee426e" stroke-width="11.0"/>
      <!-- Cylindrical Specular Glint -->
      <circle cx="115.0" cy="155.0" r="35.0" fill="none" stroke="#ffb4c8" stroke-width="3.0"/>
      <!-- Inner Dark Core -->
      <circle cx="115.0" cy="155.0" r="27.0" fill="#080e18" stroke="#060c14" stroke-width="2.0"/>
      <!-- Porcelain Ivory Center Aperture -->
      <circle cx="115.0" cy="155.0" r="15.5" fill="#fffdf6" stroke="#060c14" stroke-width="3.3"/>
    </g>
