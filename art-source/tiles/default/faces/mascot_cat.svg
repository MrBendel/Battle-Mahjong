<svg xmlns="http://www.w3.org/2000/svg" width="368" height="506" viewBox="0 0 368 506">
  <g stroke-linecap="round" stroke-linejoin="round">

    <!-- Mascot Tuxedo Cat -->
    <!-- Ears (Triangular, compact & rounded tips matching reference) -->
    <!-- Left Ear outer -->
    <path d="M84 195 L96 86 L154 145 Z" fill="#121b24" stroke="#121b24" stroke-width="12"/>
    <!-- Left Ear inner pink -->
    <path d="M98 172 L104 106 L140 146 Z" fill="#ee658d"/>
    <!-- Right Ear outer -->
    <path d="M284 195 L272 86 L214 145 Z" fill="#121b24" stroke="#121b24" stroke-width="12"/>
    <!-- Right Ear inner pink -->
    <path d="M270 172 L264 106 L228 146 Z" fill="#ee658d"/>

    <!-- Head Silhouette / Chubby round head -->
    <ellipse cx="184" cy="256" rx="136" ry="122" fill="#121b24" stroke="#121b24" stroke-width="10"/>

    <!-- Crisp rim highlight contour along left ear & left cheek -->
    <path d="M96 90 C86 130 74 185 74 245" fill="none" stroke="#ffffff" stroke-width="4.5" opacity="0.6"/>

    <!-- White Mask / Bib / Muzzle -->
    <path d="M184 194 C166 194 154 236 132 245 C108 255 96 282 98 320 C102 364 136 378 184 378 C232 378 266 364 270 320 C272 282 260 255 236 245 C214 236 202 194 184 194 Z" fill="#ffffff" stroke="#121b24" stroke-width="6"/>

    <!-- Wide open circular staring eyes -->
    <!-- Left Eye -->
    <circle cx="128" cy="226" r="30" fill="#ffffff" stroke="#121b24" stroke-width="10"/>
    <circle cx="128" cy="226" r="15" fill="#121b24"/>
    <!-- Right Eye -->
    <circle cx="240" cy="226" r="30" fill="#ffffff" stroke="#121b24" stroke-width="10"/>
    <circle cx="240" cy="226" r="15" fill="#121b24"/>

    <!-- Small Red/Coral Nose -->
    <polygon points="184,302 174,290 194,290" fill="#c92424"/>

    <!-- Tiny Mouth (inverted-w / 人 shape) -->
    <path d="M184 302 L184 308 M174 316 C179 311 184 308 184 308 C184 308 189 311 194 316" fill="none" stroke="#121b24" stroke-width="6"/>

    <!-- 3 Whiskers on each side matching reference angles -->
    <line x1="98" y1="274" x2="22" y2="268" stroke="#121b24" stroke-width="7"/>
    <line x1="94" y1="298" x2="16" y2="298" stroke="#121b24" stroke-width="7"/>
    <line x1="98" y1="322" x2="26" y2="334" stroke="#121b24" stroke-width="7"/>

    <line x1="270" y1="274" x2="346" y2="268" stroke="#121b24" stroke-width="7"/>
    <line x1="274" y1="298" x2="352" y2="298" stroke="#121b24" stroke-width="7"/>
    <line x1="270" y1="322" x2="342" y2="334" stroke="#121b24" stroke-width="7"/>
  </g>
</svg>
