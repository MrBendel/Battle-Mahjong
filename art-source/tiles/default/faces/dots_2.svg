      <!-- Outer Navy Ring -->
      <circle cx="184.0" cy="150.0" r="64.0" fill="#162f56" stroke="#121b24" stroke-width="6.4"/>
      <!-- Concentric White Gap -->
      <circle cx="184.0" cy="150.0" r="49.9" fill="#ffffff"/>
      <!-- Inner Ring -->
      <circle cx="184.0" cy="150.0" r="28.2" fill="#162f56"/>
      <!-- Center Pip -->
      <circle cx="184.0" cy="150.0" r="16.0" fill="#c92424" stroke="#121b24" stroke-width="3.8"/>
      <!-- Pinpoint white sparkle -->
      <circle cx="184.0" cy="150.0" r="5.1" fill="#ffffff"/>
    </g>
    <!-- Target Wheel 184,356 -->
    <g>
      <!-- Outer Navy Ring -->
      <circle cx="184.0" cy="356.0" r="64.0" fill="#162f56" stroke="#121b24" stroke-width="6.4"/>
