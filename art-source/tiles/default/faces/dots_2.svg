      <!-- Cylindrical Specular Glint -->
      <circle cx="144.0" cy="164.0" r="56.0" fill="none" stroke="#ffb4c8" stroke-width="4.8"/>
      <!-- Inner Dark Core -->
      <circle cx="144.0" cy="164.0" r="43.2" fill="#080e18" stroke="#060c14" stroke-width="2.0"/>
      <!-- Porcelain Ivory Center Aperture -->
      <circle cx="144.0" cy="164.0" r="24.8" fill="#fffdf6" stroke="#060c14" stroke-width="5.2"/>
    </g>
    <!-- Target Wheel 224,342 -->
