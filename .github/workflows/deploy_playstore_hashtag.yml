name: Trigger Play Store Build from PR Hashtag

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deploy-playstore:
    name: Build & Upload to Play Store
    if: |
      (
        github.event_name == 'pull_request' &&
        (contains(github.event.pull_request.body, '#deploy-playstore') || contains(github.event.pull_request.body, '#build-and-deploy'))
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (contains(github.event.comment.body, '#deploy-playstore') || contains(github.event.comment.body, '#build-and-deploy'))
      )
    runs-on: ubuntu-latest

    steps:
      - name: Add reaction to comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'rocket'
              });
            } catch (err) {
              console.log('Reaction note:', err.message);
            }

      - name: Add reaction to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.reactions.createForIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                content: 'rocket'
              });
            } catch (err) {
              console.log('Reaction note:', err.message);
            }

      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Godot Engine 4.6.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.6.3'
          use-templates: true

      - name: Import Assets & Run Core Tests
        run: |
          godot --headless --path . --editor --quit || true
          godot --headless --path . --script res://tests/cli_test_runner.gd

      - name: Decode Release Keystore
        id: keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            mkdir -p secrets
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > secrets/battle-mahjong-upload.keystore
            echo "keystore_path=secrets/battle-mahjong-upload.keystore" >> $GITHUB_OUTPUT
          fi

      - name: Set Android Export Version
        id: version
        run: |
          EPOCH_2020=1577836800
          NOW=$(date +%s)
          VERSION_CODE=$((NOW - EPOCH_2020))
          VERSION_NAME="0.1.0-internal.${VERSION_CODE}"
          godot --headless --path . --script res://scripts/tools/set_android_export_version.gd -- "${VERSION_CODE}" "${VERSION_NAME}"
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT

      - name: Godot Android Export
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build/android
          godot --headless --path . --install-android-build-template --export-release "Android" build/android/battle-mahjong.aab

      - name: Upload to Google Play Internal Track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.platypus.battlemahjong
          releaseFiles: build/android/battle-mahjong.aab
          track: internal

      - name: Post Success Comment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const issueNumber = context.payload.issue ? context.payload.issue.number : context.payload.pull_request.number;
              const vName = '${{ steps.version.outputs.version_name }}';
              const vCode = '${{ steps.version.outputs.version_code }}';
              const body = `🚀 **Play Store Build Published!**\n\n- **Version Name**: \`${vName}\`\n- **Version Code**: \`${vCode}\`\n- **Track**: Google Play Internal Testing\n\nTesters can install/update via the [Internal Testing Link](https://play.google.com/apps/internaltest/4701554282456194202).`;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: body
              });
            } catch (err) {
              console.log('Comment note:', err.message);
            }
